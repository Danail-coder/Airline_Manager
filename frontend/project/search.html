<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkyWings | Search Flights</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style/index.css" />

  <style>
    :root {
      --sky-blue: #1a73e8;
      --sky-blue-light: #52a8ff;
      --deep-blue: #0d1a3a;
      --white: #ffffff;
      --gray: #e8eef5;
    }

    body {
      background: linear-gradient(to bottom, var(--sky-blue-light), #d6eaff);
      min-height: 100vh;
      padding: 1rem;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @media (min-width: 640px) {
      body {
        padding: 2rem;
      }
    }

    /* --- Top-left Logo --- */
    .logo-top {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 30;
      width: 50px;
      height: auto;
    }

    @media (min-width: 640px) {
      .logo-top {
        width: 65px;
        left: 25px;
      }
    }

    @media (min-width: 768px) {
      .logo-top {
        width: 75px;
      }
    }

    /* Main container - centered */
    .container-wrapper {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      position: relative;
      z-index: 10;
      padding-top: 80px;
    }

    @media (min-width: 640px) {
      .container-wrapper {
        padding-top: 100px;
      }
    }

    @media (min-width: 768px) {
      .container-wrapper {
        padding-top: 0;
      }
    }



    /* --- White Card --- */
    .card {
      background: var(--white);
      border-radius: 1.5rem;
      padding: 1.5rem;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.12);
      position: relative;
      z-index: 10;
      animation: fadeIn 0.8s ease forwards;
      opacity: 0;
    }

    @media (min-width: 640px) {
      .card {
        padding: 2rem;
      }
    }

    @media (min-width: 768px) {
      .card {
        padding: 2.5rem;
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* --- Cloud Animation --- */
    .sky-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 260px;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }

    @media (max-width: 640px) {
      .sky-container {
        height: 150px;
      }
    }

    .cloud {
      opacity: 0.85;
      animation: cloudMove linear infinite;
    }

    .cloud-small { animation-duration: 58s; }
    .cloud-medium { animation-duration: 70s; }
    .cloud-large { animation-duration: 90s; }

    @keyframes cloudMove {
      from { transform: translateX(130%); }
      to   { transform: translateX(-150%); }
    }

    /* --- Animated Planes --- */
    .plane {
      animation: planeFly 14s linear infinite;
    }

    .plane-1 { animation-delay: 0s; transform: scale(1); }
    .plane-2 { animation-delay: 5s; transform: scale(0.85); }
    .plane-3 { animation-delay: 9s; transform: scale(0.7); }

    @keyframes planeFly {
      0%   { transform: translateX(-150px) translateY(0) scale(var(--scale)); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateX(130vw) translateY(-10px) scale(var(--scale)); opacity: 0; }
    }

    /* Heading responsive */
    .card h1 {
      font-size: 1.5rem;
      line-height: 2rem;
    }

    @media (min-width: 640px) {
      .card h1 {
        font-size: 1.875rem;
        line-height: 2.25rem;
      }
    }

    /* --- Inputs --- */
    input, select {
      transition: 0.25s ease-in-out;
      font-size: 1rem;
    }

    input:focus, select:focus {
      transform: scale(1.02);
      border-color: var(--sky-blue);
      box-shadow: 0 0 8px rgba(26, 115, 232, 0.4);
      outline: none;
    }

    label {
      font-size: 0.875rem;
    }

    @media (min-width: 640px) {
      label {
        font-size: 1rem;
      }
    }

    button {
      transition: all 0.3s ease;
      font-size: 1rem;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    }

    @media (min-width: 640px) {
      button {
        font-size: 1.0625rem;
      }
    }

    nav a {
      font-size: 0.875rem;
    }

    @media (min-width: 640px) {
      nav a {
        font-size: 1rem;
      }
    }
  </style>
</head>

<body>

  <!-- Animated background -->
  <div class="animated-bg"></div>

  <!-- Particles -->
  <div class="particle" style="width:4px;height:4px;top:20%;left:10%;animation-delay:0s;animation-duration:15s;"></div>
  <div class="particle" style="width:6px;height:6px;top:60%;left:80%;animation-delay:2s;animation-duration:20s;"></div>
  <div class="particle" style="width:3px;height:3px;top:80%;left:30%;animation-delay:4s;animation-duration:18s;"></div>
  <div class="particle" style="width:5px;height:5px;top:40%;left:60%;animation-delay:6s;animation-duration:22s;"></div>
  <div class="particle" style="width:4px;height:4px;top:10%;left:90%;animation-delay:3s;animation-duration:16s;"></div>
  <div class="particle" style="width:7px;height:7px;top:70%;left:15%;animation-delay:5s;animation-duration:19s;"></div>

  <!-- Clouds -->
  <div class="cloud cloud-1" style="width:150px;height:70px;top:15%;left:-200px;"></div>
  <div class="cloud cloud-2" style="width:200px;height:90px;top:50%;left:-250px;opacity:0.6;"></div>
  <div class="cloud cloud-3" style="width:180px;height:80px;top:75%;left:-220px;opacity:0.5;"></div>

  <!-- Flying plane -->
  <svg class="plane" style="top:25%;" viewBox="0 0 512 512" fill="white">
    <path d="M256 0c-25.3 0-47.2 14.7-57.6 36c-7-2.6-14.5-4-22.4-4c-35.3 0-64 28.7-64 64V261.5C97.4 271 86.3 281.6 76 291.3C45.2 317.1 14.4 355.8 3.7 401.5c-2.3 9.7 6.4 18.5 16.1 16.3C64.1 410.1 101.6 403.3 137 391c-2.3 6.4-3.5 13.4-3.5 20.7c0 33.3 20.4 61.9 49.4 73.9c-.9 4.6-1.4 9.3-1.4 14.1c0 39.8 32.2 72 72 72s72-32.2 72-72c0-4.8-.5-9.5-1.4-14.1c29-12 49.4-40.6 49.4-73.9c0-7.3-1.2-14.3-3.5-20.7c35.4 12.3 72.9 19.1 116.1 26.8c9.7 2.3 18.4-6.6 16.1-16.3c-10.7-45.7-41.5-84.4-72.3-110.2c-10.3-9.7-21.4-20.3-36-29.8V96c0-35.3-28.7-64-64-64c-7.9 0-15.4 1.4-22.4 4C303.2 14.7 281.3 0 256 0z"/>
  </svg>

  <!-- Logo Top-Left Corner -->
  <img src="../assets/logo.png" class="logo-top" alt="SkyWings Logo">

  <!-- Sky Animation -->
  <div class="sky-container">
    <svg viewBox="0 0 1440 260" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">

      <!-- Clouds -->
      <ellipse cx="1400" cy="60" rx="110" ry="28" fill="white" class="cloud cloud-large" />
      <ellipse cx="1300" cy="120" rx="70" ry="20" fill="white" class="cloud cloud-medium" />
      <ellipse cx="1600" cy="90" rx="50" ry="16" fill="white" class="cloud cloud-small" />

      <!-- Planes -->
      <g id="plane">
        <path d="M0 12c4-3 30-12 54-6s46 22 56 26c8 3 22 10 36 8 10-1 28-7 42-12 14-6 30-10 46-8 16 2 34 10 50 14 18 5 38 6 58 0" fill="#fff" stroke="#ccdff9" stroke-width="1"></path>
        <rect x="10" y="8" width="36" height="8" rx="3" fill="#ffb400"></rect>
      </g>

      <use href="#plane" class="plane plane-1" x="-200" y="40"/>
      <use href="#plane" class="plane plane-2" x="-350" y="110"/>
      <use href="#plane" class="plane plane-3" x="-500" y="20"/>
    </svg>
  </div>

  <!-- Container Wrapper - Centered -->
  <div class="container-wrapper">

    <!-- Card -->
    <div class="card">

      <h1 class="font-bold text-[var(--sky-blue)] text-center mb-4">Search Flights</h1>

      <nav class="text-center mb-6">
        <a href="login.html" class="text-red-500 hover:underline font-semibold">Logout</a>
      </nav>

      <form id="search-form" class="space-y-4">
        <div>
          <label class="block font-medium text-gray-700 mb-2">From</label>
          <input id="from" type="text" placeholder="e.g. Accra" required
            class="w-full p-3 border border-gray-300 rounded-lg">
        </div>

        <div>
          <label class="block font-medium text-gray-700 mb-2">To</label>
          <input id="to" type="text" placeholder="e.g. London" required
            class="w-full p-3 border border-gray-300 rounded-lg">
        </div>

        <div>
          <label class="block font-medium text-gray-700 mb-2">Departure Date</label>
          <input id="date" type="date" required
            class="w-full p-3 border border-gray-300 rounded-lg">
        </div>

        <div>
          <label class="block font-medium text-gray-700 mb-2">Class</label>
          <select id="class" class="w-full p-3 border border-gray-300 rounded-lg">
            <option value="Economy">Economy</option>
            <option value="Business">Business</option>
            <option value="First Class">First Class</option>
          </select>
        </div>

        <button type="submit"
          class="w-full bg-[var(--sky-blue)] text-white py-3 rounded-lg hover:bg-blue-700 font-semibold">
          Search Flights
        </button>
      </form>
    </div>

  </div>

  <script src="../js/modal.js"></script>
  <script>
    // Placeholder for search.js functionality
// search.js
document.addEventListener('DOMContentLoaded', () => {
  const searchForm = document.getElementById('search-form');

  // Set minimum date to today
  const dateInput = document.getElementById('date');
  const today = new Date().toISOString().split('T')[0];
  dateInput.setAttribute('min', today);

  searchForm.addEventListener('submit', function(e) {
    e.preventDefault();

    // Get form values
    const from = document.getElementById('from').value.trim();
    const to = document.getElementById('to').value.trim();
    const date = document.getElementById('date').value;
    const flightClass = document.getElementById('class').value;

    // Validate inputs
    if (!from || !to || !date) {
      showError('Validation Error', 'Please fill in all required fields.');
      return;
    }

    // Create search criteria object
    const searchCriteria = {
      from: from,
      to: to,
      date: date,
      class: flightClass,
      timestamp: new Date().toISOString()
    };

    // Save search criteria to localStorage
    localStorage.setItem('flightSearchCriteria', JSON.stringify(searchCriteria));

    // Redirect to results page
    window.location.href = 'results.html';
  });
});
  </script>
</body>
</html>
