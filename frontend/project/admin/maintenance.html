<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SkyWings | Aircraft Maintenance</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../style/index.css" />

  <style>
    :root {
      --sky-blue: #1a73e8;
      --sky-blue-light: #52a8ff;
      --deep-blue: #0d1a3a;
      --white: #ffffff;
      --gray: #e8eef5;
    }

    body {
      background: linear-gradient(to bottom, var(--sky-blue-light), #d6eaff);
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      position: relative;
      margin: 0;
      display: flex;
    }

    .logo-top { position: fixed; top: 20px; left: 25px; z-index: 30; width: 65px; }
    .sky-container { position: fixed; top: 0; left: 0; right: 0; width: 100%; height: 260px; overflow: hidden; z-index: 0; pointer-events: none; }
    .cloud { opacity: 0.85; animation: cloudMove linear infinite; }
    .cloud-small { animation-duration: 58s; }
    .cloud-medium { animation-duration: 70s; }
    .cloud-large { animation-duration: 90s; }
    @keyframes cloudMove { from { transform: translateX(130%); } to { transform: translateX(-150%); } }
    .plane { animation: planeFly 14s linear infinite; }
    .plane-1 { animation-delay: 0s; transform: scale(1); }
    .plane-2 { animation-delay: 5s; transform: scale(0.85); }
    .plane-3 { animation-delay: 9s; transform: scale(0.7); }
    @keyframes planeFly { 0% { transform: translateX(-150px) translateY(0) scale(var(--scale)); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateX(130vw) translateY(-10px) scale(var(--scale)); opacity: 0; } }
    .sidebar { background-color: var(--deep-blue); z-index: 20; position: fixed; left: 0; top: 0; width: 256px; height: 100vh; padding: 1.25rem; color: white; }
    .sidebar a.active { background-color: var(--sky-blue-light); }
    main { margin-left: 256px; padding: 2rem; position: relative; z-index: 10; min-height: 100vh; width: calc(100% - 256px); }
    .card { background: var(--white); border-radius: 1rem; padding: 1.5rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .fade-in { opacity: 0; transform: translateY(20px); animation: fadeInUp 0.6s ease forwards; }
    @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
    .fade-in:nth-child(1) { animation-delay: 0.1s; }
    .fade-in:nth-child(2) { animation-delay: 0.2s; }
    .fade-in:nth-child(3) { animation-delay: 0.3s; }
    .fade-in:nth-child(4) { animation-delay: 0.4s; }
    .input-field { border: 1px solid #ccc; padding: 0.5rem; border-radius: 0.5rem; transition: all 0.3s; }
    .input-field:focus { border-color: var(--sky-blue); outline: none; box-shadow: 0 0 5px var(--sky-blue-light); }
    .btn-primary { background-color: var(--sky-blue); color: var(--white); transition: all 0.3s; }
    .btn-primary:hover { background-color: var(--sky-blue-light); }
    table th, table td { padding: 0.75rem; }
  </style>
</head>
<body class="font-sans flex">

  <!-- Animated background -->
  <div class="animated-bg"></div>

  <!-- Particles -->
  <div class="particle" style="width:4px;height:4px;top:20%;left:10%;animation-delay:0s;animation-duration:15s;"></div>
  <div class="particle" style="width:6px;height:6px;top:60%;left:80%;animation-delay:2s;animation-duration:20s;"></div>
  <div class="particle" style="width:3px;height:3px;top:80%;left:30%;animation-delay:4s;animation-duration:18s;"></div>
  <div class="particle" style="width:5px;height:5px;top:40%;left:60%;animation-delay:6s;animation-duration:22s;"></div>
  <div class="particle" style="width:4px;height:4px;top:10%;left:90%;animation-delay:3s;animation-duration:16s;"></div>
  <div class="particle" style="width:7px;height:7px;top:70%;left:15%;animation-delay:5s;animation-duration:19s;"></div>

  <!-- Clouds -->
  <div class="cloud cloud-1" style="width:150px;height:70px;top:15%;left:-200px;"></div>
  <div class="cloud cloud-2" style="width:200px;height:90px;top:50%;left:-250px;opacity:0.6;"></div>
  <div class="cloud cloud-3" style="width:180px;height:80px;top:75%;left:-220px;opacity:0.5;"></div>

  <!-- Flying plane -->
  <svg class="plane" style="top:25%;" viewBox="0 0 512 512" fill="white">
    <path d="M256 0c-25.3 0-47.2 14.7-57.6 36c-7-2.6-14.5-4-22.4-4c-35.3 0-64 28.7-64 64V261.5C97.4 271 86.3 281.6 76 291.3C45.2 317.1 14.4 355.8 3.7 401.5c-2.3 9.7 6.4 18.5 16.1 16.3C64.1 410.1 101.6 403.3 137 391c-2.3 6.4-3.5 13.4-3.5 20.7c0 33.3 20.4 61.9 49.4 73.9c-.9 4.6-1.4 9.3-1.4 14.1c0 39.8 32.2 72 72 72s72-32.2 72-72c0-4.8-.5-9.5-1.4-14.1c29-12 49.4-40.6 49.4-73.9c0-7.3-1.2-14.3-3.5-20.7c35.4 12.3 72.9 19.1 116.1 26.8c9.7 2.3 18.4-6.6 16.1-16.3c-10.7-45.7-41.5-84.4-72.3-110.2c-10.3-9.7-21.4-20.3-36-29.8V96c0-35.3-28.7-64-64-64c-7.9 0-15.4 1.4-22.4 4C303.2 14.7 281.3 0 256 0z"/>
  </svg>

  <!-- Logo Top-Left -->
  <img src="../../assets/logo.png" class="logo-top" alt="SkyWings Logo">

  <!-- Sky Container with Clouds and Planes -->
  <div class="sky-container">
    <svg viewBox="0 0 1440 260" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="1400" cy="60" rx="110" ry="28" fill="white" class="cloud cloud-large" />
      <ellipse cx="1300" cy="120" rx="70" ry="20" fill="white" class="cloud cloud-medium" />
      <ellipse cx="1600" cy="90" rx="50" ry="16" fill="white" class="cloud cloud-small" />
      <g id="plane">
        <path d="M0 12c4-3 30-12 54-6s46 22 56 26c8 3 22 10 36 8 10-1 28-7 42-12 14-6 30-10 46-8 16 2 34 10 50 14 18 5 38 6 58 0" fill="#fff" stroke="#ccdff9" stroke-width="1"></path>
        <rect x="10" y="8" width="36" height="8" rx="3" fill="#ffb400"></rect>
      </g>
      <use href="#plane" class="plane plane-1" x="-200" y="40"/>
      <use href="#plane" class="plane plane-2" x="-350" y="110"/>
      <use href="#plane" class="plane plane-3" x="-500" y="20"/>
    </svg>
  </div>

  <!-- Sidebar -->
  <aside class="sidebar">
    <img src="https://cdn-icons-png.flaticon.com/512/804/804920.png" alt="SkyWings Logo" class="w-24 mb-8">
    <h2 class="text-2xl font-bold mb-8">✈️ Admin Panel</h2>
    <nav class="flex flex-col gap-3">
      <a href="admin-dashboard.html" class="hover:bg-sky-blue p-2 rounded">🏠 Dashboard</a>
      <a href="flights.html" class="hover:bg-sky-blue p-2 rounded">✈️ Flights</a>
      <a href="passengers.html" class="hover:bg-sky-blue p-2 rounded">🧍 Passengers</a>
      <a href="staff.html" class="hover:bg-sky-blue p-2 rounded">👨‍✈️ Crew / Staff</a>
      <a href="maintenance.html" class="bg-sky-blue p-2 rounded active">🔧 Maintenance</a>
      <a href="reports.html" class="hover:bg-sky-blue p-2 rounded">📊 Reports</a>
      <a href="settings.html" class="hover:bg-sky-blue p-2 rounded">⚙️ System</a>
      <a href="admin-login.html" class="text-red-500 hover:underline mt-6">Logout</a>
    </nav>
  </aside>

  <!-- Main -->
  <main>

    <h2 class="text-xl font-semibold text-deep-blue mb-4">Aircraft Maintenance Dashboard</h2>

    <!-- Add Maintenance Record -->
    <form id="maintenance-form" class="card fade-in mb-6">
      <div class="grid md:grid-cols-2 gap-4">
        <label class="block">
          <span class="text-sm font-medium text-gray-700">Aircraft ID</span>
          <input type="text" id="aircraft-id" class="input-field w-full" placeholder="e.g. A320-001" required />
        </label>
        <label class="block">
          <span class="text-sm font-medium text-gray-700">Maintenance Type</span>
          <select id="type" class="input-field w-full" required>
            <option value="">Select Type</option>
            <option>Routine Inspection</option>
            <option>Engine Check</option>
            <option>Cabin Upgrade</option>
            <option>Landing Gear Repair</option>
          </select>
        </label>
        <label class="block">
          <span class="text-sm font-medium text-gray-700">Date</span>
          <input type="date" id="date" class="input-field w-full" required />
        </label>
        <label class="block">
          <span class="text-sm font-medium text-gray-700">Status</span>
          <select id="status" class="input-field w-full" required>
            <option>Pending</option>
            <option>In Progress</option>
            <option>Completed</option>
          </select>
        </label>
      </div>
      <label class="block mt-4">
        <span class="text-sm font-medium text-gray-700">Remarks</span>
        <textarea id="remarks" rows="3" class="input-field w-full" placeholder="Add remarks..."></textarea>
      </label>

      <button type="submit" class="btn-primary mt-4 px-4 py-2 rounded">Add Record</button>
    </form>

    <!-- Maintenance Table -->
    <section class="fade-in">
      <h3 class="text-lg font-semibold mb-2 text-deep-blue">Maintenance Records</h3>
      <div class="card fade-in overflow-x-auto">
        <table class="w-full border-collapse">
          <thead class="bg-sky-blue-light text-white">
            <tr>
              <th>Aircraft</th>
              <th>Type</th>
              <th>Date</th>
              <th>Status</th>
              <th>Remarks</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="maintenance-table" class="divide-y divide-gray-200"></tbody>
        </table>
      </div>
    </section>

  </main>

  <script src="../js/admin-maintenance.js"></script>
</body>
</html>
